<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="MIYA — ofis xotirasi: chat orqali CRM">
  <defs>
    <linearGradient id="fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#16204a"/>
    </linearGradient>
    <radialGradient id="shar" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#8fb4ff"/>
      <stop offset=".7" stop-color="#6d4dff"/>
      <stop offset="1" stop-color="#1b2a8a"/>
    </radialGradient>
    <radialGradient id="nur" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5b7cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5b7cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tor" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1f2a55"/>
    </pattern>
    <style>
      .sarlavha{font:800 54px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#f8fafc;letter-spacing:1px}
      .izoh{font:500 22px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#a3b0d6}
      .teg{font:600 15px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#d5ddf5}
      .xab{font:600 14px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
      .kich{font:500 12px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#fon)"/>
  <rect width="1280" height="360" fill="url(#tor)" opacity=".7"/>

  <g transform="translate(64 0)">
    <circle cx="28" cy="98" r="40" fill="url(#nur)">
      <animate attributeName="r" values="34;44;34" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="98" r="26" fill="url(#shar)"/>
    <text class="sarlavha" x="0" y="190">MIYA</text>
    <text class="izoh" x="0" y="232">Ofis xotirasi: pul, maosh, ishlar, mijozlar — chat orqali</text>
    <g transform="translate(0 270)">
      <rect width="90" height="30" rx="15" fill="#1d2756"/><text class="teg" x="45" y="20" text-anchor="middle">FastAPI</text>
      <rect x="100" width="80" height="30" rx="15" fill="#1d2756"/><text class="teg" x="140" y="20" text-anchor="middle">SQLite</text>
      <rect x="190" width="104" height="30" rx="15" fill="#1d2756"/><text class="teg" x="242" y="20" text-anchor="middle">Telegram</text>
      <rect x="304" width="84" height="30" rx="15" fill="#1d2756"/><text class="teg" x="346" y="20" text-anchor="middle">LLM API</text>
      <rect x="398" width="80" height="30" rx="15" fill="#1d2756"/><text class="teg" x="438" y="20" text-anchor="middle">Excel</text>
    </g>
  </g>

  <!-- Chat: gap → kartochka → tasdiq → hisob (SMIL, 10 s sikl) -->
  <g transform="translate(720 28)">
    <rect width="500" height="304" rx="20" fill="#e9eef8"/>
    <rect width="500" height="304" rx="20" fill="url(#tor)" opacity=".25"/>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.04;.08;.92;1" dur="10s" repeatCount="indefinite"/>
      <rect x="196" y="20" width="284" height="40" rx="14" fill="#d9fdd3"/>
      <text class="xab" x="212" y="45" fill="#0f172a">Akmalga 500 ming avans berdim</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.25;.92;1" dur="10s" repeatCount="indefinite"/>
      <rect x="20" y="74" width="300" height="104" rx="14" fill="#ffffff"/>
      <text class="xab" x="36" y="100" fill="#0f172a">Yozib oldim · Avans</text>
      <text class="xab" x="36" y="124" fill="#334155">Akmal Toshpo'latov</text>
      <text class="xab" x="36" y="148" fill="#0f172a" style="font-weight:800">500 000 so'm</text>
      <text class="kich" x="36" y="168">Asosiy kassa · bugun 08:12</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.32;.36;.92;1" dur="10s" repeatCount="indefinite"/>
      <rect x="20" y="186" width="146" height="34" rx="10" fill="#64748b"/>
      <rect x="20" y="186" width="146" height="34" rx="10" fill="#2f5bff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.46;.5;.92;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text class="xab" x="93" y="208" text-anchor="middle" fill="#ffffff">To'g'ri</text>
      <rect x="174" y="186" width="146" height="34" rx="10" fill="#64748b"/>
      <text class="xab" x="247" y="208" text-anchor="middle" fill="#ffffff">Tuzatish</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.58;.63;.92;1" dur="10s" repeatCount="indefinite"/>
      <rect x="20" y="232" width="460" height="54" rx="14" fill="#ffffff"/>
      <circle cx="44" cy="259" r="12" fill="url(#shar)"/>
      <text class="xab" x="66" y="254" fill="#0f172a">Kassada: 9 650 000 so'm</text>
      <text class="kich" x="66" y="274">Akmal «oldim» deb tasdiqlagach hisobiga kiradi</text>
      <text class="xab" x="466" y="264" text-anchor="end" fill="#dc2626">− 500 000</text>
    </g>
  </g>
</svg>
